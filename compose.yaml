# Musicarr + slskd (Soulseek). Drop this folder in Documents\Docker\compose\musicarr
# and add "- musicarr/compose.yaml" to the include: list in your main compose.yaml.
#
# Edit the two host paths marked  <-- below (use forward slashes on Windows, e.g. D:/Media/Music).
# Everything else — indexers, download clients and your Soulseek account — is set up in Musicarr's web UI.
services:
  musicarr:
    image: ghcr.io/feynos-lin/musicarr:latest
    container_name: musicarr
    restart: unless-stopped
    environment:
      - TZ=America/Denver
      - PUID=1000
      - PGID=1000
      - MUSICARR_SLSKD_URL=http://slskd:5030      # Musicarr adds slskd automatically on first start
    ports:
      - "8689:8689"
    volumes:
      - ./config:/config
      - D:/Media/Music:/music            # <-- your music library (the same folder Navidrome reads)
      - D:/Downloads:/downloads          # <-- shared downloads folder (qBittorrent / SABnzbd / slskd)
    depends_on:
      - slskd

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    environment:
      - TZ=America/Denver
      - SLSKD_REMOTE_CONFIGURATION=true   # lets Musicarr manage slskd's settings
      # Don't add SLSKD_SLSK_* / SLSKD_*_DIR variables here: they would override what you set in Musicarr.
    ports:
      - "50300:50300"        # Soulseek listen port — forward it on your router for faster transfers
      # - "5030:5030"        # slskd's own web UI (login slskd/slskd). Only needed for troubleshooting.
    volumes:
      - ./slskd:/app
      - D:/Downloads:/downloads
      - D:/Media/Music:/music:ro
