# Musicarr + slskd (Soulseek). Drop this folder in Documents\Docker\compose\musicarr
# and add "- musicarr/compose.yaml" to the include: list in your main compose.yaml.
#
# Edit the host paths marked  <-- below (use forward slashes on Windows, e.g. D:/Media/Music).
# Each protocol downloads to its own folder; they can be on different drives.
# Everything else — indexers, download clients and your Soulseek account — is set up in Musicarr's web UI.
services:
  musicarr:
    image: ghcr.io/feynos-lin/musicarr:latest
    container_name: musicarr
    restart: unless-stopped
    environment:
      - TZ=America/Denver
      - PUID=1000
      - PGID=1000
      - MUSICARR_SLSKD_URL=http://slskd:5030      # Musicarr adds slskd automatically on first start
    ports:
      - "8689:8689"
    volumes:
      - ./config:/config
      - D:/Media/Music:/music                       # <-- your music library (the same folder Navidrome reads)
      - D:/Downloads/Torrents:/downloads/torrents   # <-- torrent downloads (qBittorrent/Transmission/Deluge)
      - D:/Downloads/Usenet:/downloads/usenet       # <-- Usenet downloads (SABnzbd/NZBGet)
      - D:/Downloads/Soulseek:/downloads/soulseek   # <-- Soulseek downloads (slskd)
    depends_on:
      - slskd

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    environment:
      - TZ=America/Denver
      - SLSKD_REMOTE_CONFIGURATION=true   # lets Musicarr manage slskd's settings
      # Don't add SLSKD_SLSK_* / SLSKD_*_DIR variables here: they would override what you set in Musicarr.
    ports:
      - "50300:50300"        # Soulseek listen port — forward it on your router for faster transfers
      # - "5030:5030"        # slskd's own web UI (login slskd/slskd). Only needed for troubleshooting.
    volumes:
      - ./slskd:/app
      - D:/Downloads/Soulseek:/downloads/soulseek   # <-- same folder as Musicarr's Soulseek mount
      - D:/Media/Music:/music:ro

# Your torrent and Usenet clients: mount the same host folders at the same container paths
# (e.g. qBittorrent: D:/Downloads/Torrents:/downloads/torrents, SABnzbd: D:/Downloads/Usenet:/downloads/usenet).
# Then in Musicarr set qBittorrent's Download Folder to /downloads/torrents, and point SABnzbd's
# "music" category at /downloads/usenet. If a client uses different paths, add a Remote Path Mapping
# in Settings → Media Management.
